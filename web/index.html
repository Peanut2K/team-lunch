<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fbf4e4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a130f" media="(prefers-color-scheme: dark)">
  <title>ข้าวเที่ยงทีม · สั่งข้าวเที่ยง</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    /* ?theme=light|dark บังคับธีม (ไว้ให้ QA ถ่าย screenshot) — ปกติตามเครื่อง */
    (function () {
      var t = new URLSearchParams(location.search).get('theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">ข้ามไปเนื้อหา</a>
  <main id="main" class="page" tabindex="-1">
    <header class="masthead">
      <p class="masthead__brand" id="brand">ข้าวเที่ยงทีม</p>
      <span class="mode-chip" id="mode-chip" hidden></span>
    </header>

    <!-- หัวรอบ: ร้าน + เวลาปิดรับ (เห็นทันทีที่เปิด) -->
    <section class="round-head" aria-labelledby="store">
      <h1 class="round-head__store" id="store">กำลังโหลดรอบวันนี้…</h1>
      <p class="round-head__date" id="round-date"></p>
      <div id="cutoff"></div>
    </section>

    <div id="no-round" hidden></div>

    <div id="ordering" class="stack" hidden>
      <!-- ชื่อ: จำไว้ในเครื่อง · ชื่อเดิมกลับมาเห็น order เดิม (D12) -->
      <div class="field" id="who">
        <label class="field__label" for="name">ชื่อของคุณ</label>
        <input class="field__input" id="name" name="name" type="text" autocomplete="nickname"
               maxlength="40" placeholder="ชื่อที่ทีมเรียก" enterkeyhint="done">
        <p class="field__error" id="name-error" hidden></p>
      </div>

      <div id="order-notice" hidden></div>

      <!-- หลังสั่ง: สรุปสิ่งที่สั่ง + แก้ / ยกเลิก -->
      <div id="order-done" tabindex="-1" hidden></div>

      <!-- เลือกเมนู + หมายเหตุ -->
      <section id="order" class="stack" aria-labelledby="order-title" hidden>
        <div class="order-head">
          <h2 class="section-title" id="order-title">เลือกเมนู</h2>
          <button type="button" class="btn btn--quiet" id="edit-cancel" hidden>ไม่แก้แล้ว</button>
        </div>
        <ul id="board"></ul>
        <p class="field__error" id="lines-error" hidden></p>
        <form class="order-form" id="order-form" novalidate>
          <div class="field">
            <label class="field__label" for="note">หมายเหตุถึงร้าน <span class="field__hint">(ไม่บังคับ)</span></label>
            <textarea class="field__input" id="note" name="note" rows="2" maxlength="100" placeholder="เช่น ไม่เอาหนัง น้ำจิ้มแยก"></textarea>
            <p class="field__error" id="note-error" hidden></p>
          </div>
        </form>
      </section>
    </div>
  </main>

  <div id="orderbar" hidden></div>

  <script src="mock-server.js"></script>
  <script src="api.js"></script>
  <script src="ui.js"></script>
  <script src="order.js"></script>
</body>
</html>
