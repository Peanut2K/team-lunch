<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fbf4e4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a130f" media="(prefers-color-scheme: dark)">
  <title>ข้าวเที่ยงทีม</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    /* ?theme=light|dark บังคับธีม (ไว้ให้ QA ถ่าย screenshot) — ปกติตามเครื่อง */
    (function () {
      var t = new URLSearchParams(location.search).get('theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">ข้ามไปเนื้อหา</a>
  <main id="main" class="page" tabindex="-1">
    <header class="masthead">
      <p class="masthead__brand" id="brand">ข้าวเที่ยงทีม</p>
      <span class="mode-chip" id="mode-chip" hidden></span>
    </header>

    <!-- หัวรอบ: ร้าน + เวลาปิดรับ (เห็นทันทีที่เปิด) -->
    <section class="round-head" aria-labelledby="store">
      <h1 class="round-head__store" id="store">กำลังโหลดรอบวันนี้…</h1>
      <p class="round-head__date" id="round-date"></p>
      <div id="cutoff"></div>
    </section>

    <div class="kit stack-lg">
      <section class="kit__section" aria-labelledby="kit-cutoff">
        <h2 class="kit__title" id="kit-cutoff">แถบเวลาปิดรับ 3 สถานะ</h2>
        <p class="kit__desc">นับถอยหลังจากเวลา server เหลือไม่ถึง 10 นาทีเปลี่ยนเป็นสีขมิ้น ถึงเวลาแล้วเป็นสีเทาอุ่น</p>
        <div class="kit__samples">
          <div id="sample-open"></div>
          <div id="sample-soon"></div>
          <div id="sample-closed"></div>
        </div>
      </section>
    </div>
  </main>

  <script src="mock-server.js"></script>
  <script src="api.js"></script>
  <script src="ui.js"></script>
  <script src="kit.js"></script>
</body>
</html>
